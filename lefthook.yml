min_version: 2.1.0
lefthook: mise exec -- bin/lefthook
glob_matcher: doublestar
pre-commit:
  parallel: true
  jobs:
    - name: Ruby and Markdown examples
      glob: ["**/*.rb", "**/*.rake", "**/*.md", "Gemfile", "Gemfile.lock", "Rakefile", "config.ru", "bin/*", ".rubocop.yml"]
      exclude: ["vendor/**", "native/**", "node_modules/**"]
      run: bin/rubocop
    - name: HTML and ERB
      glob: ["app/**/*.erb", "test/components/previews/**/*.erb", ".herb.yml", "package*.json", "bin/erb-check"]
      run: bin/erb-check
    - name: AgentPrism
      glob: ["app/frontend/agents/**", "test/frontend/**", "vendor/agent-prism/**", "script/*agents*", "script/check-agent-prism.mjs", "tsconfig.agents.json", "package*.json"]
      run: npm run check:agents
    - name: Skills
      glob: [".agents/**", "config/agent_skills.json", "vendor/agent-skills/**", "bin/skills"]
      run: bin/skills check
    - name: Native contracts
      glob: ["public/configurations/**", "native/**", "bin/native"]
      run: bin/native check
