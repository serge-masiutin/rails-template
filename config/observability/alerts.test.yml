rule_files:
  - /etc/prometheus/alerts.yml
evaluation_interval: 1m
tests:
  - name: AnyCable is unavailable for over two minutes
    interval: 1m
    input_series:
      - series: 'up{job="anycable",instance="test"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: StarterAppRealtimeUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: StarterAppRealtimeUnavailable
        exp_alerts:
          - exp_labels:
              job: anycable
              instance: test
              severity: critical
            exp_annotations:
              summary: AnyCable is not exposing metrics
  - name: Transient failures do not alert; persistent failures do
    interval: 1m
    input_series:
      - series: 'up{job="starterapp",instance="test"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: StarterAppUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: StarterAppUnavailable
        exp_alerts:
          - exp_labels:
              job: starterapp
              instance: test
              severity: critical
            exp_annotations:
              summary: StarterApp is not exposing metrics
  - name: Worker is missing while dispatcher remains active
    interval: 1m
    input_series:
      - series: 'starterapp_queue_processes{kind="worker"}'
        values: '0 0 0 0'
      - series: 'starterapp_queue_processes{kind="dispatcher"}'
        values: '1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: StarterAppWorkerMissing
        exp_alerts:
          - exp_labels:
              kind: worker
              severity: critical
            exp_annotations:
              summary: No active queue process worker
  - name: imgproxy is unavailable for over two minutes
    interval: 1m
    input_series:
      - series: 'up{job="imgproxy",instance="test"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: StarterAppImagesUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: StarterAppImagesUnavailable
        exp_alerts:
          - exp_labels:
              job: imgproxy
              instance: test
              severity: critical
            exp_annotations:
              summary: imgproxy is not exposing metrics
  - name: Job metrics are unavailable for over two minutes
    interval: 1m
    input_series:
      - series: 'up{job="starterapp_jobs",instance="test"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: StarterAppJobMetricsUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: StarterAppJobMetricsUnavailable
        exp_alerts:
          - exp_labels:
              job: starterapp_jobs
              instance: test
              severity: warning
            exp_annotations:
              summary: The jobs process is not exposing metrics
  - name: Trace loss triggers an alert
    interval: 1m
    input_series:
      - series: 'starterapp_agent_trace_failures{stage="storage"}'
        values: '0 0 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: StarterAppAgentTraceFailures
        exp_alerts: []
      - eval_time: 3m
        alertname: StarterAppAgentTraceFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Could not store Active Agent traces
