groups:
  - name: starterapp
    rules:
      - alert: StarterAppAgentTraceFailures
        expr: sum(increase(starterapp_agent_trace_failures[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Could not store Active Agent traces"
      - alert: StarterAppJobMetricsUnavailable
        expr: up{job="starterapp_jobs"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "The jobs process is not exposing metrics"
      - alert: StarterAppImagesUnavailable
        expr: up{job="imgproxy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "imgproxy is not exposing metrics"
      - alert: StarterAppRealtimeUnavailable
        expr: up{job="anycable"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AnyCable is not exposing metrics"
      - alert: StarterAppRealtimeRpcErrors
        expr: sum(rate(anycable_go_rpc_error_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AnyCable is receiving Rails RPC errors"
      - alert: StarterAppUnavailable
        expr: up{job="starterapp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "StarterApp is not exposing metrics"
      - alert: StarterAppWorkerMissing
        expr: starterapp_queue_processes{kind=~"worker|dispatcher"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No active queue process {{ $labels.kind }}"
      - alert: StarterAppFailedJobs
        expr: starterapp_queue_jobs{state="failed"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The queue contains failed jobs"
      - alert: StarterAppQueueDelayed
        expr: starterapp_queue_oldest_ready_age_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The oldest Ready job has been waiting for over a minute"
      - alert: StarterAppHttpErrors
        expr: sum(rate(rails_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(rails_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx responses exceed 5%"
