inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-thread_safety
  - rubocop-md

AllCops:
  Exclude:
    - "vendor/**/*" # Third-party code.
    - ".agents/**/*" # Instructional examples, including intentional antipatterns.
    - "node_modules/**/*" # Installed npm dependencies.
    - ".ruby-lsp/**/*" # Generated editor environment.
    - "native/**/*" # Android is checked by Gradle lint.

Markdown:
  WarnInvalid: true
  Autodetect: false

ThreadSafety/ActiveSupportCallbacks:
  Enabled: true
ThreadSafety/MethodRedefinition:
  Enabled: true
ThreadSafety/LazySynchronizationPrimitive:
  Enabled: true

# ENV is shared by all request and job threads.
ThreadSafety/EnvMutation:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "lib/**/*.rb"
