# Rails Omakase style and thread-safety checks.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-thread_safety
  - rubocop-md

AllCops:
  Exclude:
    - "vendor/**/*"
    - ".agents/**/*"
    - "node_modules/**/*"
    - ".ruby-lsp/**/*"
    - "native/**/*"

Markdown:
  WarnInvalid: true
  Autodetect: false

ThreadSafety/ActiveSupportCallbacks:
  Enabled: true
ThreadSafety/MethodRedefinition:
  Enabled: true
ThreadSafety/LazySynchronizationPrimitive:
  Enabled: true

# ENV is shared across request and job threads.
ThreadSafety/EnvMutation:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "lib/**/*.rb"
